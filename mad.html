<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Movie Search App</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #111;
      color: white;
      text-align: center;
    }

    h1 {
      margin-top: 20px;
    }

    .search-box {
      margin: 20px;
    }

    input {
      padding: 8px;
      width: 200px;
    }

    button {
      padding: 8px;
      cursor: pointer;
      background-color: #e50914;
      color: white;
      border: none;
    }

    .movies {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
    }

    .card {
      background: #222;
      margin: 10px;
      padding: 10px;
      width: 180px;
      border-radius: 5px;
    }

    .card img {
      width: 100%;
    }
  </style>
</head>

<body>

  <h1>🎬 Movie Search</h1>

  <div class="search-box">
    <input type="text" id="search" placeholder="Enter movie name">
    <button onclick="searchMovies()">Search</button>
  </div>

  <div id="movies" class="movies"></div>

  <script>
    const API_KEY = "99b4c039"; // put your API key here

    function searchMovies() {
      let query = document.getElementById("search").value;

      fetch(`https://www.omdbapi.com/?s=${query}&apikey=${API_KEY}`)
        .then(response => response.json())
        .then(data => {
          showMovies(data.Search);
        });
    }

    function showMovies(movies) {
      let output = document.getElementById("movies");
      output.innerHTML = "";

      if (!movies) {
        output.innerHTML = "<p>No movies found</p>";
        return;
      }

      movies.forEach(movie => {
        output.innerHTML += `
          <div class="card">
            <img src="${movie.Poster}">
            <h3>${movie.Title}</h3>
            <p>${movie.Year}</p>
          </div>
        `;
      });
    }
  </script>

</body>
</html>
